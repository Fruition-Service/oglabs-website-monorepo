# Validate the sync automation itself. This does not touch production: the
# suite runs the real export pipeline against a local fixture site served on
# ephemeral ports, so changed content behaviour is proven without publishing
# anything.

name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'export.sh'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'export.sh'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, syntax and suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Shell lint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning export.sh scripts/framer-source-state.sh scripts/tests/run-tests.sh

      - name: Workflow and action syntax
        run: |
          curl -sSfL -o /tmp/actionlint.bash \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
          bash /tmp/actionlint.bash > /tmp/actionlint-install.log
          ./actionlint -color -shellcheck= .github/workflows/*.yml

      - name: Python syntax
        run: |
          python3 -m compileall -q scripts

      - name: Test suite
        env:
          SKIP_NETWORK_TESTS: '0'
        run: bash scripts/tests/run-tests.sh
